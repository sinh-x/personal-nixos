# herdr configuration
# Managed declaratively by Nix home-manager (sinh-x.cli-apps.multiplexers.herdr)
# Reference: https://herdr.dev

onboarding = false

[theme]
name = "tokyo-night"

[keys]
# Ctrl+B is the primary action namespace; only previous_workspace and next_workspace lack prefix routes.
prefix = "ctrl+b"
# Global direct-key allowlist: only the four Alt+Shift+Arrow bindings below bypass Ctrl+B.
# Directional semantics: prefix+Arrows focus panes once; Alt+Shift+Left/Right move between tabs and Alt+Shift+Up/Down move between workspaces.
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_right = ["prefix+l", "prefix+right"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_down = ["prefix+j", "prefix+down"]
previous_tab = ["prefix+p", "alt+shift+left"]
next_tab = ["prefix+n", "alt+shift+right"]
new_tab = ["prefix+c"]
split_vertical = ["prefix+d"]
zoom = ["prefix+z"]
previous_workspace = ["alt+shift+up"]
next_workspace = ["alt+shift+down"]
switch_workspace = ["prefix+1", "prefix+2", "prefix+3", "prefix+4", "prefix+5", "prefix+6", "prefix+7", "prefix+8", "prefix+9"]
focus_agent = ["prefix+alt+1", "prefix+alt+2", "prefix+alt+3", "prefix+alt+4", "prefix+alt+5", "prefix+alt+6", "prefix+alt+7", "prefix+alt+8", "prefix+alt+9"]
workspace_picker = ["prefix+w", "prefix+m"]

# Ctrl+B then M (or W) opens native Navigate mode. All arrows and h/j/k/l repeatedly
# focus panes; disable the default Up/Down workspace selection in this mode.
# Left/Right arrows are native aliases and must not be configured here.
# Enter/Esc leave the mode; other native shortcuts (including 1–9) are unchanged.
navigate_workspace_up = []
navigate_workspace_down = []
navigate_pane_left = ["h"]
navigate_pane_down = ["j", "down"]
navigate_pane_up = ["k", "up"]
navigate_pane_right = ["l"]

[[keys.command]]
key = "prefix+a"
type = "pane"
command = '''
target=$(${HERDR_BIN_PATH:-herdr} agent list | jq -r '.result.agents[] | "\(.terminal_id)\t\(.agent)\t\(.workspace_id)\t\(.cwd)"' 2>/dev/null | fzf --with-nth=2.. --prompt="Agent > " | awk '{print $1}')
if [ -n "$target" ]; then
  ${HERDR_BIN_PATH:-herdr} agent focus "$target"
fi
'''
