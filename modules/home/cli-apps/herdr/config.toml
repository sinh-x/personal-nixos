# herdr configuration
# Managed declaratively by Nix home-manager (sinh-x.cli-apps.multiplexers.herdr)
# Reference: https://herdr.dev

onboarding = false

[theme]
name = "tokyo-night"

[keys]
# Ctrl+B is the primary action namespace; every Herdr action retains a prefix route.
prefix = "ctrl+b"
# Direct-key allowlist: only the four Alt+Shift+Arrow bindings below bypass Ctrl+B.
# Directional semantics: Left/Right move between tabs; Up/Down move between workspaces.
focus_pane_left = ["prefix+h"]
focus_pane_right = ["prefix+l"]
focus_pane_up = ["prefix+k"]
focus_pane_down = ["prefix+j"]
previous_tab = ["prefix+left", "prefix+p", "alt+shift+left"]
next_tab = ["prefix+right", "prefix+n", "alt+shift+right"]
new_tab = ["prefix+c"]
split_vertical = ["prefix+d"]
zoom = ["prefix+z"]
previous_workspace = ["prefix+up", "alt+shift+up"]
next_workspace = ["prefix+down", "alt+shift+down"]
switch_workspace = ["prefix+1", "prefix+2", "prefix+3", "prefix+4", "prefix+5", "prefix+6", "prefix+7", "prefix+8", "prefix+9"]
focus_agent = ["prefix+alt+1", "prefix+alt+2", "prefix+alt+3", "prefix+alt+4", "prefix+alt+5", "prefix+alt+6", "prefix+alt+7", "prefix+alt+8", "prefix+alt+9"]
workspace_picker = ["prefix+w"]

[[keys.command]]
key = "prefix+a"
type = "pane"
command = '''
target=$(${HERDR_BIN_PATH:-herdr} agent list | jq -r '.result.agents[] | "\(.terminal_id)\t\(.agent)\t\(.workspace_id)\t\(.cwd)"' 2>/dev/null | fzf --with-nth=2.. --prompt="Agent > " | awk '{print $1}')
if [ -n "$target" ]; then
  ${HERDR_BIN_PATH:-herdr} agent focus "$target"
fi
'''
