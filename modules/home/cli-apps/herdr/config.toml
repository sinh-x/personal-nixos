# herdr configuration
# Managed declaratively by Nix home-manager (sinh-x.cli-apps.multiplexers.herdr)
# Reference: https://herdr.dev

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "alt+left", "ctrl+alt+left"]
focus_pane_right = ["prefix+l", "alt+right", "ctrl+alt+right"]
focus_pane_up = ["prefix+k", "alt+up", "ctrl+alt+up"]
focus_pane_down = ["prefix+j", "alt+down", "ctrl+alt+down"]
previous_tab = ["prefix+p", "alt+shift+left", "ctrl+alt+shift+left"]
next_tab = ["prefix+n", "alt+shift+right", "ctrl+alt+shift+right", "ctrl+alt+tab"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+d", "ctrl+alt+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
switch_workspace = ["prefix+1", "prefix+2", "prefix+3", "prefix+4", "prefix+5", "prefix+6", "prefix+7", "prefix+8", "prefix+9", "ctrl+alt+1", "ctrl+alt+2", "ctrl+alt+3", "ctrl+alt+4", "ctrl+alt+5", "ctrl+alt+6", "ctrl+alt+7", "ctrl+alt+8", "ctrl+alt+9"]
